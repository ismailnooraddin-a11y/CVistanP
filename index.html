<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EstateFlow real estate CRM and management system frontend demo" />
  <meta name="theme-color" content="#246bfd" />
  <title>EstateFlow CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div><strong>EstateFlow</strong><span>Real Estate OS</span></div>
      </div>
      <nav id="mainNav" aria-label="Primary navigation"></nav>
      <div class="sidebar-bottom">
        <button class="upgrade-card" data-action="open-packages">
          <span class="upgrade-icon">✦</span>
          <span><strong>Professional Plan</strong><small>Manage modules</small></span>
        </button>
        <div class="user-mini">
          <div class="avatar">IN</div>
          <div style="flex:1"><strong>Ismail Noor</strong><span>System owner</span></div>
          <button class="icon-btn" aria-label="User menu">⋮</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
          <label class="global-search" for="searchInput">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="Search clients, properties, contracts..." autocomplete="off" />
            <kbd>Ctrl K</kbd>
          </label>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">◐</button>
          <button class="icon-btn notify" data-action="notifications" aria-label="Notifications">♢<span>4</span></button>
          <button class="primary-btn" data-action="quick-create">＋ Create</button>
        </div>
      </header>
      <section class="page-content" id="pageContent" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast-area" id="toastArea" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
