<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vercel Connection Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f7f2ec;
      color: #2d211c;
    }
    main {
      width: min(92%, 620px);
      padding: 48px 32px;
      text-align: center;
      background: white;
      border: 1px solid #e7ddd5;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(68, 43, 31, 0.10);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3.5rem); }
    p { margin: 8px 0; line-height: 1.6; color: #66554c; }
    .status {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #e8f7ec;
      color: #176b35;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Connection Works</h1>
    <p>This page was deployed from GitHub to Vercel.</p>
    <p>If you can see it, the repository connection and deployment are working correctly.</p>
    <div class="status">Deployment successful</div>
  </main>
</body>
</html>
